<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página con estructura semántica</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        header, nav, main, footer {
            padding: 20px;
            text-align: center;
            border: 1px solid #ddd;
        }
        header {
            background-color: #f8b400;
        }
        nav {
            background-color: #333;
            color: white;
        }
        nav ul {
            list-style: none;
            padding: 0;
        }
        nav ul li {
            display: inline;
            margin: 0 15px;
        }
        main {
            display: flex;
            padding: 20px;
            background-color: #f4f4f4;
        }
        section {
            flex: 2;
            padding: 10px;
        }
        aside {
            flex: 1;
            padding: 10px;
            background-color: #ddd;
        }
        article {
            background: white;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
        }
        footer {
            background-color: #222;
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <h1>Bienvenido a mi página</h1>
    </header>
    <nav>
        <ul>
            <li><a href="#">Inicio</a></li>
            <li><a href="#">Acerca de</a></li>
            <li><a href="#">Servicios</a></li>
            <li><a href="#">Contacto</a></li>
        </ul>
    </nav>
    <main>
        <section>
            <article>
                <h2>Artículo 1</h2>
                <p>Contenido del primer artículo...</p>
            </article>
            <article>
                <h2>Artículo 2</h2>
                <p>Contenido del segundo artículo...</p>
            </article>
        </section>
        <aside>
            <h2>Información adicional</h2>
            <p>Contenido del aside...</p>
        </aside>
    </main>
    <footer>
        <p>Derechos reservados &copy; 2025</p>
    </footer>
</body>
</html>
